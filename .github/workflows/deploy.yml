name: deploy

# Push na main: checagem de fumaça (composer, cache de rotas, build do front) e, se passar,
# entra por SSH na VPS e roda /home/clevernote/deploy.sh (cópia em deploy/deploy.sh).
# A chave só pode rodar esse script. A suíte de testes (workflow "tests") ainda não está verde,
# por isso o deploy não depende dela.
#
# Secrets do environment `prod` (Settings → Environments → prod):
#   DEPLOY_SSH_KEY   chave PRIVADA dedicada (github-actions@clevernote); a pública está
#                    no ~/.ssh/authorized_keys do user clevernote, presa ao deploy.sh
#   DEPLOY_HOST      IP da VPS

on:
  push:
    branches: [main]
  workflow_dispatch: {}

concurrency:
  group: deploy-production
  cancel-in-progress: false

jobs:
  smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          tools: composer:v2

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Composer
        run: composer install --no-interaction --prefer-dist --no-progress

      - name: Rotas e config
        run: |
          cp .env.example .env
          php artisan key:generate
          php artisan route:cache
          php artisan config:cache

      - name: Build do front
        run: |
          npm ci --ignore-scripts --no-audit --no-fund
          npm run build

  deploy:
    needs: smoke
    runs-on: ubuntu-latest
    environment: prod
    env:
      SHA: ${{ github.sha }}

    steps:
      - name: Setup SSH
        env:
          DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
        run: |
          [ -n "$DEPLOY_SSH_KEY" ] || { echo "::error::secret DEPLOY_SSH_KEY vazio ou ausente"; exit 1; }
          [ -n "$DEPLOY_HOST" ] || { echo "::error::secret DEPLOY_HOST vazio ou ausente"; exit 1; }
          mkdir -p ~/.ssh
          printf '%s\n' "$DEPLOY_SSH_KEY" | tr -d '\r' > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          ssh-keygen -y -f ~/.ssh/deploy_key > /dev/null || { echo "::error::DEPLOY_SSH_KEY não é uma chave privada válida"; exit 1; }
          ssh-keyscan -T 15 -H "$(echo "$DEPLOY_HOST" | tr -d '[:space:]')" >> ~/.ssh/known_hosts 2>/dev/null || true
          [ -s ~/.ssh/known_hosts ] || { echo "::error::ssh-keyscan não alcançou o DEPLOY_HOST"; exit 1; }

      - name: Deploy
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
        run: ssh -i ~/.ssh/deploy_key "clevernote@$(echo "$DEPLOY_HOST" | tr -d '[:space:]')" "$SHA"

      - name: Confere a versão no ar
        run: |
          sleep 3
          LIVE=$(curl -fsS "https://getclevernote.app/REVISION" | tr -d '[:space:]')
          echo "no ar: $LIVE | esperado: $SHA"
          test "$LIVE" = "$SHA"

      - name: Limpa a chave
        if: always()
        run: rm -f ~/.ssh/deploy_key
